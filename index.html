
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Shining Window | کُليَل کَڙڪي</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f4efe3;
    color: #222;
    min-height: 100vh;
}


/* ==================================================
   HEADER
================================================== */

header {
    width: 100%;
    text-align: center;

    padding: 24px 8px 20px;

    background:
        linear-gradient(
            180deg,
            #fffef9 0%,
            #f8f0df 55%,
            #eadabb 100%
        );

    border-bottom: 4px solid #b89554;

    box-shadow:
        0 5px 18px rgba(0,0,0,0.16);

    overflow: hidden;
}


/* ==================================================
   ENGLISH TITLE
================================================== */

.main-title {
    display: block;

    width: 100%;
    max-width: 1200px;

    margin: 0 auto;

    font-size: clamp(42px, 9vw, 92px);

    line-height: 1.05;

    font-weight: 900;

    letter-spacing: 2px;

    color: #fffdf5;

    text-shadow:
        2px 2px 0 #a0782e,
        4px 4px 0 #765421,
        6px 6px 0 #50380f,
        9px 9px 15px rgba(0,0,0,0.38);

    transform:
        perspective(600px)
        rotateX(5deg);
}


/* ==================================================
   SINDHI TITLE
================================================== */

.sindhi-title {
    display: block;

    width: 100%;

    margin: 10px auto 0;

    font-family:
        "Noto Nastaliq Urdu",
        "Noto Sans Arabic",
        "Noto Sans",
        Arial,
        sans-serif;

    font-size: clamp(40px, 9vw, 82px);

    line-height: 1.5;

    font-weight: 900;

    direction: rtl;

    color: #fffdf5;

    text-shadow:
        2px 2px 0 #8b5827,
        4px 4px 0 #633b18,
        6px 6px 0 #43270f,
        9px 9px 15px rgba(0,0,0,0.38);

    transform:
        perspective(600px)
        rotateX(5deg);
}


/* ==================================================
   LOGO SECTION
================================================== */

.window-section {
    width: 100%;

    display: flex;

    justify-content: center;

    align-items: center;

    padding: 28px 6px 18px;
}


/* ==================================================
   LOGO FRAME
================================================== */

.window-frame {
    width: min(1200px, 98vw);

    background: #fff;

    padding: 9px;

    border: 8px solid #8c6934;

    border-radius: 18px;

    box-shadow:
        0 10px 30px rgba(0,0,0,0.28),
        inset 0 0 0 3px #d6b878;

    overflow: hidden;
}


/* ==================================================
   LOGO IMAGE
================================================== */

.window-frame img {
    display: block;

    width: 100%;

    height: auto;

    max-height: 70vh;

    object-fit: contain;

    border-radius: 7px;
}


/* ==================================================
   INTRODUCTION
================================================== */

.introduction {
    width: min(950px, 92vw);

    margin: 24px auto;

    padding: 25px;

    background:
        rgba(255,255,255,0.92);

    border-radius: 16px;

    border: 1px solid #d4c19b;

    box-shadow:
        0 6px 20px rgba(0,0,0,0.12);

    text-align: center;
}


.introduction h2 {
    font-size:
        clamp(28px, 5vw, 42px);

    margin-bottom: 13px;

    color: #765421;

    text-shadow:
        1px 2px 2px rgba(0,0,0,0.15);
}


.introduction p {
    font-size:
        clamp(18px, 3.8vw, 23px);

    line-height: 1.7;

    color: #333;
}


/* ==================================================
   BUTTONS
================================================== */

.buttons {
    display: flex;

    flex-wrap: wrap;

    justify-content: center;

    gap: 16px;

    width: min(1100px, 94vw);

    margin: 24px auto 40px;
}


.btn {
    display: inline-block;

    min-width: 200px;

    padding: 14px 28px;

    border-radius: 32px;

    background:
        linear-gradient(
            145deg,
            #c9a65f,
            #765421
        );

    color: #fff;

    text-decoration: none;

    font-size: 19px;

    font-weight: bold;

    text-align: center;

    box-shadow:
        0 5px 0 #50380f,
        0 9px 18px rgba(0,0,0,0.20);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease;
}


.btn:hover {
    transform: translateY(-3px);

    box-shadow:
        0 8px 0 #50380f,
        0 13px 22px rgba(0,0,0,0.22);
}


.btn:active {
    transform: translateY(3px);

    box-shadow:
        0 2px 0 #50380f,
        0 4px 9px rgba(0,0,0,0.15);
}


/* ==================================================
   FOOTER
================================================== */

footer {
    text-align: center;

    padding: 24px 10px;

    background:
        linear-gradient(
            180deg,
            #30291f,
            #211c15
        );

    color: #eee;

    font-size: 16px;

    border-top: 3px solid #b89554;
}


footer .footer-sindhi {
    margin-top: 8px;

    direction: rtl;

    font-family:
        "Noto Nastaliq Urdu",
        "Noto Sans Arabic",
        "Noto Sans",
        Arial,
        sans-serif;

    font-size: 21px;

    font-weight: bold;
}


/* ==================================================
   MOBILE
================================================== */

@media (max-width: 600px) {

    header {
        padding:
            18px
            4px
            15px;
    }


    .main-title {
        font-size: 40px;

        letter-spacing: 1px;

        line-height: 1.08;

        white-space: normal;
    }


    .sindhi-title {
        margin-top: 7px;

        font-size: 39px;

        line-height: 1.5;
    }


    .window-section {
        padding:
            18px
            3px
            12px;
    }


    .window-frame {
        width: 99vw;

        padding: 5px;

        border-width: 5px;

        border-radius: 12px;
    }


    .window-frame img {
        width: 100%;

        max-height: 60vh;

        border-radius: 5px;
    }


    .introduction {
        width: 94vw;

        padding: 18px;

        margin-top: 15px;
    }


    .introduction h2 {
        font-size: 30px;
    }


    .introduction p {
        font-size: 18px;

        line-height: 1.65;
    }


    .buttons {
        width: 94vw;

        gap: 14px;

        margin-bottom: 30px;
    }


    .btn {
        width: 90%;

        min-width: 0;

        padding: 13px 20px;

        font-size: 18px;
    }


    footer {
        padding:
            20px
            8px;
    }

}


/* ==================================================
   VERY SMALL PHONES
================================================== */

@media (max-width: 380px) {

    .main-title {
        font-size: 34px;
    }


    .sindhi-title {
        font-size: 34px;
    }


    .window-frame {
        width: 98vw;
    }

}

</style>

</head>


<body>


<!-- ==================================================
     HEADER
================================================== -->

<header>

    <div class="main-title">
        The Shining Window
    </div>

    <div
        class="sindhi-title"
        lang="sd"
        dir="rtl">

        کُليَل کَڙڪي

    </div>

</header>



<!-- ==================================================
     MAIN LOGO / WINDOW
================================================== -->

<section class="window-section">

    <div class="window-frame">

        <img
            src="logo.png"
            alt="The Shining Window - کُليَل کَڙڪي"
        >

    </div>

</section>



<!-- ==================================================
     INTRODUCTION
================================================== -->

<section class="introduction">

    <h2>
        The Shining Window
    </h2>

    <p>
        A window that opens the way to stories,
        imagination, learning and new ideas.
    </p>

</section>



<!-- ==================================================
     NAVIGATION BUTTONS
================================================== -->


<div class="buttons">

    <a href="categories.html" class="btn">
        Explore
    </a>

    <a href="write.html" class="btn">
        Write for Us
    </a>

</div>


<!-- ==================================================
     FOOTER
================================================== -->

<footer>

    <div>
        The Shining Window
    </div>

    <div
        class="footer-sindhi"
        lang="sd"
        dir="rtl">

        کُليَل کَڙڪي

    </div>

</footer>


</body>

</html>
