
<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>The Shining Window | کُليَل کَڙڪي</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Georgia, "Times New Roman", serif;
    background: #f4efe3;
    color: #222;
    min-height: 100vh;
}

/* =========================
   HEADER
========================= */

header {
    width: 100%;
    text-align: center;
    padding: 22px 12px 18px;
    background: linear-gradient(180deg, #fffdf7, #eee5d2);
    border-bottom: 3px solid #b89554;
}

/* English title */

.main-title {
    display: inline-block;
    max-width: 92%;
    font-size: clamp(34px, 8vw, 72px);
    line-height: 1.05;
    font-weight: 900;
    letter-spacing: 2px;

    color: #fffdf5;

    text-shadow:
        2px 2px 0 #7d5b20,
        4px 4px 0 #5c4318,
        6px 6px 10px rgba(0,0,0,0.35);

    transform: perspective(500px) rotateX(5deg);
}

/* Sindhi title */

.sindhi-title {
    margin-top: 14px;
    font-family: "Noto Nastaliq Urdu",
                 "Noto Sans Arabic",
                 "Arial",
                 sans-serif;

    font-size: clamp(32px, 8vw, 64px);
    line-height: 1.4;
    font-weight: 900;

    direction: rtl;

    color: #fffdf5;

    text-shadow:
        2px 2px 0 #70451f,
        4px 4px 0 #4d2d14,
        6px 6px 10px rgba(0,0,0,0.35);

    transform: perspective(500px) rotateX(5deg);
}

/* =========================
   WINDOW SECTION
========================= */

.window-section {
    width: 100%;
    display: flex;
    justify-content: center;
    padding: 25px 15px 15px;
}

.window-frame {
    width: min(850px, 94vw);
    background: #fff;
    padding: 10px;
    border: 8px solid #8c6934;
    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.25),
        inset 0 0 0 3px #d6b878;
}

.window-frame img {
    display: block;
    width: 100%;
    height: auto;
    max-height: 62vh;
    object-fit: contain;
    border-radius: 5px;
}

/* =========================
   INTRODUCTION
========================= */

.introduction {
    width: min(900px, 92vw);
    margin: 22px auto;
    padding: 22px;

    background: rgba(255,255,255,0.85);

    border-radius: 14px;
    border: 1px solid #d4c19b;

    box-shadow: 0 5px 18px rgba(0,0,0,0.10);

    text-align: center;
}

.introduction h2 {
    font-size: clamp(25px, 5vw, 38px);
    margin-bottom: 12px;
    color: #765421;
}

.introduction p {
    font-size: clamp(17px, 3.8vw, 22px);
    line-height: 1.7;
}

/* =========================
   BUTTONS
========================= */

.buttons {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 14px;

    width: min(900px, 94vw);
    margin: 20px auto 35px;
}

.btn {
    display: inline-block;
    padding: 13px 24px;

    border-radius: 30px;

    background: linear-gradient(145deg, #b89554, #765421);
    color: white;

    text-decoration: none;

    font-size: 18px;
    font-weight: bold;

    box-shadow:
        0 5px 0 #50380f,
        0 8px 15px rgba(0,0,0,0.18);

    transition: transform 0.2s ease,
                box-shadow 0.2s ease;
}

.btn:hover {
    transform: translateY(-3px);
    box-shadow:
        0 8px 0 #50380f,
        0 12px 18px rgba(0,0,0,0.20);
}

.btn:active {
    transform: translateY(3px);
    box-shadow:
        0 2px 0 #50380f,
        0 4px 8px rgba(0,0,0,0.15);
}

/* =========================
   FOOTER
========================= */

footer {
    text-align: center;
    padding: 22px 10px;

    background: #29231a;
    color: #eee;

    font-size: 15px;
}

footer .footer-sindhi {
    margin-top: 7px;

    direction: rtl;

    font-family:
        "Noto Nastaliq Urdu",
        "Noto Sans Arabic",
        Arial,
        sans-serif;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    header {
        padding: 17px 8px 14px;
    }

    .main-title {
        max-width: 95%;
        font-size: 38px;
        letter-spacing: 1px;
    }

    .sindhi-title {
        margin-top: 8px;
        font-size: 37px;
    }

    .window-section {
        padding: 18px 10px 10px;
    }

    .window-frame {
        width: 94vw;
        border-width: 5px;
        padding: 6px;
    }

    .window-frame img {
        max-height: 55vh;
    }

    .introduction {
        padding: 17px;
        margin-top: 15px;
    }

    .btn {
        width: 90%;
        text-align: center;
    }
}

</style>
</head>

<body>

<header>

    <div class="main-title">
        The Shining Window
    </div>

    <div class="sindhi-title" lang="sd">
        کُليَل کَڙڪي
    </div>

</header>


<section class="window-section">

    <div class="window-frame">

        <!--
        Replace "window.jpg" with the exact filename
        of your window picture if necessary.
        -->

       <img src="logo.png">

    </div>

</section>


<section class="introduction">

    <h2>The Shining Window</h2>

    <p>
        A window that opens the way to stories,
        imagination, learning and new ideas.
    </p>

</section>


<div class="buttons">

    <a href="#" class="btn">
        Read Stories
    </a>

    <a href="#" class="btn">
        Explore
    </a>

</div>


<footer>

    <div>
        The Shining Window
    </div>

    <div class="footer-sindhi" lang="sd">
        کُليَل کَڙڪي
    </div>

</footer>

</body>
</html>
